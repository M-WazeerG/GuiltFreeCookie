spring.application.name=guiltFreeCookie

# Secrets never live in this file. Set them as environment variables, or for
# local development copy .env.example to .env (git-ignored) and fill it in.
spring.config.import=optional:file:.env[.properties]

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guiltFreeCookie?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Server ----
server.servlet.context-path=/guiltFreeCookie
server.port=${PORT:8080}

# Never leak internals in error responses.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Trust X-Forwarded-* only from proxies on private networks (Tomcat's default
# internal-proxies list), so HTTPS detection and rate limiting see the real
# client. Behind a public CDN, set server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native

# The API is stateless (bearer tokens), so it never sets a session cookie.
# These settings are a backstop in case anything ever creates one.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ---- Uploads ----
app.upload.root-dir=${UPLOAD_DIR:uploads}
app.upload.cookie-subdir=cookies
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# ---- Auth ----
# Base64-encoded, at least 32 bytes. Generate one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- Browser access ----
# Comma-separated origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
# Redirect plain HTTP to HTTPS (turn on wherever the API is served over TLS).
app.security.require-https=${REQUIRE_HTTPS:false}

# ---- Rate limits (requests per client IP per window) ----
app.rate-limit.login.requests=10
app.rate-limit.login.window-seconds=300
app.rate-limit.newsletter.requests=5
app.rate-limit.newsletter.window-seconds=3600
app.rate-limit.api.requests=300
app.rate-limit.api.window-seconds=60
